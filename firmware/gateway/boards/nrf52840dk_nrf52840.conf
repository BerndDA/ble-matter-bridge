# Experimental nRF52840 port: Matter (BLE peripheral) + 2 BLE central links
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=4
# Providers: up to 6 BTHome sensors plus GATT devices (thermostats)
CONFIG_BRIDGE_MAX_BRIDGED_DEVICES_NUMBER=8
# Each BTHome sensor uses 2 endpoints
CONFIG_BRIDGE_MAX_DYNAMIC_ENDPOINTS_NUMBER=16
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
