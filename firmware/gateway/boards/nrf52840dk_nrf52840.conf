# Experimental nRF52840 port: Matter (BLE peripheral) + 2 BLE central links
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=4
# Providers: one per BTHome device (GATEWAY_BTHOME_MAX_SENSORS), e.g. 4 sensors + 4 thermostats + 2 spare
CONFIG_BRIDGE_MAX_BRIDGED_DEVICES_NUMBER=10
# A sensor uses 2 endpoints, a thermostat 1: 4 x 2 + 4 x 1 = 12, plus room for 2 more sensors
CONFIG_BRIDGE_MAX_DYNAMIC_ENDPOINTS_NUMBER=20
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Own Matter identity, so the DK can be commissioned next to the Pro Micro (which keeps the SDK test values).
# The factory data, including the SPAKE2 verifier, is generated from these.
CONFIG_CHIP_DEVICE_SERIAL_NUMBER="BLEGW-DK-0001"
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF01
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202022
CONFIG_CHIP_DEVICE_ROTATING_DEVICE_UID="5d2c8a41e07b4f3a9c16b8d2e4f0a713"
