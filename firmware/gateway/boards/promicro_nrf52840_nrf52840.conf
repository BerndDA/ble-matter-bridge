# Pro Micro nRF52840. Same limits as the DK (boards/nrf52840dk_nrf52840.conf).
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=4
CONFIG_BRIDGE_MAX_BRIDGED_DEVICES_NUMBER=10
CONFIG_BRIDGE_MAX_DYNAMIC_ENDPOINTS_NUMBER=20
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Flashed over SWD with the UF2 bootloader erased: link at 0x0, not after the MBR.
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
CONFIG_USE_DT_CODE_PARTITION=y

# Many clones have no 32.768 kHz crystal; the RC oscillator works on all of them.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Console and shell run over USB (CDC ACM); the board sets that up itself.

# No MCUboot, so no Matter DFU (see Kconfig.sysbuild).
CONFIG_CHIP_BOOTLOADER_NONE=y
