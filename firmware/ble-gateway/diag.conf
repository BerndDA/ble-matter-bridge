# Diagnostics build for measurements (plan step 5). Not for normal use.
#   west build -b nrf52840dk/nrf52840 --sysbuild -d firmware/ble-gateway/build-diag firmware/ble-gateway -- -DEXTRA_CONF_FILE=diag.conf

# Matter heap watermarks (`matter stat`), OpenThread shell (`ot ...`), net and kernel shells
CONFIG_CHIP_MEMORY_PROFILING=y

# Stack high-water marks (`kernel thread stacks`) and CPU use per thread (`kernel thread list`)
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# System heap statistics (`kernel heap`)
CONFIG_SYS_HEAP_RUNTIME_STATS=y
